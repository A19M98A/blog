{{ define "main" }}
<section class="term">
  <div class="term-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-title">exit code 404</span></div>
  <div class="term-body">
    <p class="cmd">cd <span id="lost-path">this-page</span></p>
    <p class="out err">zsh: no such file or directory</p>
    <p class="cmd">suggest</p>
    <div class="out links-row">
      <a href="{{ "/" | relURL }}">cd ~</a>
      <a href="{{ "posts/" | relURL }}">ls posts/</a>
      <a href="{{ "about/" | relURL }}">cat about.md</a>
    </div>
    <p class="cmd" style="margin:0"><span class="cursor" aria-hidden="true"></span></p>
  </div>
</section>
<script>document.getElementById("lost-path").textContent = location.pathname;</script>
{{ end }}
