<div class="progress" aria-hidden="true"></div>
<header class="site-header">
  <div class="wrap wide">
    <a class="logo" href="{{ "/" | relURL }}" aria-label="{{ site.Params.author }}, home">
      <span class="logo-mark" aria-hidden="true">&gt;_</span><span>amin<span class="tilde">@janipoor</span></span>
    </a>
    <nav class="nav" aria-label="Main">
      {{- $current := . }}
      {{- range site.Menus.main }}
        {{- $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (eq $current.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $current.RelPermalink .URL)) }}
        <a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      <button class="icon-btn search-btn" type="button" aria-label="Search" title="Search (/)">{{ partial "icons.html" "search" }}<span class="kbd">/</span></button>
      <button class="icon-btn theme-toggle" type="button" aria-label="Toggle light or dark theme" title="Toggle theme (t)">{{ partial "icons.html" "theme" }}</button>
    </nav>
  </div>
</header>
