<article class="card">
  <div class="card-top">
    <span class="lang" data-lang="{{ .Params.language }}">{{ .Params.language }}</span>
    {{- with .Params.status }}<span class="badge {{ . }}">{{ . }}</span>{{ end }}
  </div>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p>{{ .Summary | plainify }}</p>
  <div class="card-meta">
    <span class="mono">{{ .Date.Format "2006" }}{{ if ne (.Date.Format "2006") (.Lastmod.Format "2006") }}–{{ .Lastmod.Format "2006" }}{{ end }}</span>
  </div>
</article>
