<li class="ls-item">
  <time class="ls-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  <a class="ls-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
  <div class="ls-meta">
    <span>{{ .ReadingTime }} min read</span>
    {{- range .Params.tags }}
      <a class="tag" href="{{ (printf "tags/%s/" (. | urlize)) | relURL }}">{{ . | urlize }}</a>
    {{- end }}
  </div>
</li>
