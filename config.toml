baseURL = "https://aminjanipoor.ir/"
title = "AM.A"
locale = "en-us"
theme = "nerd"
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = true

[menu]
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 1
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100

[params]
  author = "AminAllah Janipoor"
  handle = "amin"
  avatar = "avatar.webp"
  description = "PhD student in computer hardware engineering at the University of Tehran. Notes on computer architecture, gem5, systems and side projects."
  homePosts = 5
  nickname = "Amin"

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/A19M98A"
  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/aminjani/"
